[project]
name = "better-claude-rc"
version = "0.1.0"
description = "Mobile-first PWA remote control for Claude Code sessions on your Mac"
readme = "README.md"
license = "MIT"
authors = [{ name = "Rafa Rayes" }]
requires-python = ">=3.14"
keywords = ["claude", "claude-code", "remote-control", "pwa", "mobile",
            "terminal", "ai", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Terminals",
]
dependencies = [
    "claude-agent-sdk>=0.2.111",
    "fastapi>=0.139.0",
    "pynacl>=1.6.2",
    "qrcode>=8.2",
    "uvicorn[standard]>=0.50.2",
    "websockets>=16.0",
]

[project.urls]
Homepage = "https://bcrc.rrayes.com"
Repository = "https://github.com/rafa-rrayes/better-claude-rc"

[project.scripts]
better-claude-rc = "server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
# The PWA ships inside the wheel (server/web/**), including vendored JS.
artifacts = ["server/web/**"]

[tool.hatch.build.targets.sdist]
include = ["server", "scripts", "README.md", "LICENSE"]

[tool.uv.workspace]
members = ["platform"]

[tool.uv.sources]
bcrc-platform = { workspace = true }

[dependency-groups]
dev = [
    "bcrc-platform",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
