[project]
name = "bcrc-platform"
version = "0.1.0"
description = "Better Claude RC hosted platform: accounts, machine registry, blind relay (private, not published)"
requires-python = ">=3.14"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "asyncpg>=0.31.0",
    "better-claude-rc",
    "fastapi>=0.139.0",
    "prometheus-client>=0.25.0",
    "pynacl>=1.6.2",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.50.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "app/migrations"

[tool.uv.sources]
better-claude-rc = { workspace = true }
