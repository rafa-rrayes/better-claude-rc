[project]
name = "bcrc-platform"
version = "0.1.0"
description = "Better Claude RC hosted platform: accounts, machine registry, blind relay (private, not published)"
requires-python = ">=3.14"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.50.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
